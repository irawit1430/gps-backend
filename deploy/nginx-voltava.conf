# /etc/nginx/sites-available/voltava
# Terminate TLS on 443, reverse-proxy to Node on 127.0.0.1:3000.
# Socket.IO upgrade headers included.
#
# Bootstrap:
#   sudo ln -s /etc/nginx/sites-available/voltava /etc/nginx/sites-enabled/voltava
#   sudo certbot --nginx -d api.voltava.in
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.voltava.in;

    # ACME challenge for Certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.voltava.in;

    # Certbot will fill these in:
    # ssl_certificate     /etc/letsencrypt/live/api.voltava.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.voltava.in/privkey.pem;

    # Modern TLS baseline
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reasonable payload cap (matches express body limit + headroom)
    client_max_body_size 512k;

    # Rate-limit shape (Node also enforces; this is defense-in-depth)
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # WebSocket / Socket.IO upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
